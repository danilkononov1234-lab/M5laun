name: Buckshot Momentum 012
on:
  push:
    branches: [buckshot-flipper-v2]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract uploaded sources
        run: |
          test -f Buckshot_v3_sources.zip
          mkdir -p extracted
          unzip -o Buckshot_v3_sources.zip -d extracted
          app=$(find extracted -type f -name application.fam -print -quit)
          test -n "$app"
          rm -rf buckshot_flipper
          cp -r "$(dirname "$app")" buckshot_flipper
      - name: Get Momentum
        run: git clone --recursive --depth 1 --branch mntm-012 https://github.com/Next-Flip/Momentum-Firmware.git firmware
      - name: Build
        run: |
          cp -r buckshot_flipper firmware/applications_user/
          cd firmware
          ./fbt fap_buckshot_flipper
      - name: Locate compiled FAP
        run: |
          find firmware -type f -name '*.fap' -print
          fap=$(find firmware -type f -name 'buckshot_flipper.fap' -print -quit)
          test -n "$fap"
          mkdir -p output
          cp "$fap" output/Buckshot_Roulette.fap
      - uses: actions/upload-artifact@v4
        with:
          name: Buckshot-Roulette-Momentum-012
          path: output/Buckshot_Roulette.fap
          if-no-files-found: error
