name: Bruce SuperMini build
on:
  workflow_dispatch:
  push:
    paths:
      - 'Bruce_port.zip.part*'
      - '.github/workflows/bruce-supermini.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Extract source
        run: |
          cat Bruce_port.zip.part00 Bruce_port.zip.part01 Bruce_port.zip.part02 > bruce.zip
          unzip -q bruce.zip -d bruce-source
      - name: Restore original Bruce dependencies
        working-directory: bruce-source/firmware-main
        run: |
          python - <<'PY'
          import configparser, pathlib, subprocess, shutil
          c=configparser.ConfigParser()
          c.read('.gitmodules')
          for section in c.sections():
              p=pathlib.Path(c[section]['path'])
              url=c[section]['url']
              force=p.name in ('Adafruit-BusIO','Adafruit-PN532')
              if force and p.exists():
                  shutil.rmtree(p)
              if p.exists() and any(p.iterdir()):
                  continue
              p.parent.mkdir(parents=True, exist_ok=True)
              subprocess.run(['git','clone','--depth','1','--recursive',url,str(p)],check=True)
          PY
      - name: Install PlatformIO
        run: python -m pip install platformio
      - name: Build firmware
        working-directory: bruce-source/firmware-main
        run: pio run -e S3_supermini_madara
      - uses: actions/upload-artifact@v4
        with:
          name: Bruce-SuperMini-ST7735
          path: bruce-source/firmware-main/.pio/build/S3_supermini_madara/*.bin
          if-no-files-found: error
