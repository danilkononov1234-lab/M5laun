name: Bruce SuperMini build
on:
  workflow_dispatch:
  push:
    paths:
      - 'Bruce_port.zip.part*'
      - '.github/workflows/bruce-supermini.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Extract source
        run: |
          cat Bruce_port.zip.part00 Bruce_port.zip.part01 Bruce_port.zip.part02 > bruce.zip
          unzip -q bruce.zip -d bruce-source
      - name: Restore Adafruit BusIO
        working-directory: bruce-source/firmware-main
        run: |
          if [ ! -f lib/Adafruit-BusIO/library.properties ] && [ ! -f lib/Adafruit-BusIO/library.json ]; then
            mkdir -p lib
            git clone --depth 1 https://github.com/adafruit/Adafruit_BusIO.git /tmp/bruce-busio
            mkdir -p lib/Adafruit-BusIO
            cp -a /tmp/bruce-busio/. lib/Adafruit-BusIO/
          fi
      - name: Restore missing submodules
        working-directory: bruce-source/firmware-main
        run: |
          if [ -f .gitmodules ]; then
            python - <<'PY'
          import configparser, pathlib, subprocess
          c=configparser.ConfigParser()
          c.read('.gitmodules')
          for section in c.sections():
              p=pathlib.Path(c[section]['path'])
              url=c[section]['url']
              if p.exists() and any(p.iterdir()):
                  continue
              if url.startswith('https://github.com/'):
                  p.parent.mkdir(parents=True, exist_ok=True)
                  subprocess.run(['git','clone','--depth','1','--recursive',url,str(p)],check=True)
          PY
          fi
          if [ ! -f lib/Adafruit-PN532/library.properties ] && [ ! -f lib/Adafruit-PN532/library.json ]; then
            git clone --depth 1 https://github.com/adafruit/Adafruit-PN532.git /tmp/bruce-pn532
            mkdir -p lib/Adafruit-PN532
            cp -a /tmp/bruce-pn532/. lib/Adafruit-PN532/
          fi
      - name: Install PlatformIO
        run: python -m pip install platformio
      - name: Build firmware
        working-directory: bruce-source/firmware-main
        run: pio run -e S3_supermini_madara
      - uses: actions/upload-artifact@v4
        with:
          name: Bruce-SuperMini-ST7735
          path: bruce-source/firmware-main/.pio/build/S3_supermini_madara/*.bin
          if-no-files-found: error
